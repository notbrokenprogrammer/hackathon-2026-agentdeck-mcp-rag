name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./...
      - if: runner.os == 'Linux'
        run: |
          go build -o bin/lastcrew .
          python3 scripts/test-launcher.py bin/lastcrew
          go run ./cmd/smoke-release ./bin/lastcrew

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Tests use the vendored Three.js and Node; no original design ZIP needed.
      - run: npm test
      - run: python3 scripts/build_crew_corpus.py --check
      - run: python3 scripts/test-publication.py
      - run: python3 scripts/check-publication.py --staged
